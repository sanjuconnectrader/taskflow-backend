name: Validate and deploy API
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Start isolated PostgreSQL with an ephemeral password
        run: node scripts/ci-database.mjs
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - if: always()
        run: docker rm -f taskflow-ci-postgres || true
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require configured production approval protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/production" --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          test "$rules" -gt 0 || { echo "Configure required reviewers on the production environment before production releases."; exit 1; }
      - uses: actions/checkout@v7
      - run: node -e "if(process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)throw Error('Tag must match package version')"
      - name: Deploy the validated commit to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/deploy-render.mjs
